<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Mộc Tiên Phát - Báo cáo thi công nội thất</title>

  <!-- SEO & PWA Meta Tags -->
  <meta name="description"
    content="Hệ thống báo cáo thi công và quản lý vật tư nội thất chuyên nghiệp dành cho thợ và giám sát.">
  <meta name="theme-color" content="#121212">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" sizes="192x192" href="icons/icon-192.png">

  <!-- Premium Fonts supporting full Vietnamese diacritics -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Application Stylesheet -->
  <link rel="stylesheet" href="css/style.css?v=20260821-static-worker-status">

  <!-- Pin the tested UMD build so browser behavior cannot change unexpectedly. -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.78.0/dist/umd/supabase.js"
    crossorigin="anonymous" onerror="window.__SUPABASE_LOAD_FAILED__=true"></script>
</head>

<body>
  <!-- Toast System for Notifications -->
  <div id="toast-container"></div>

  <!-- Main App Shell -->
  <div id="app">
    <div class="initial-loader">
      <div class="loader-spinner"></div>
      <div class="loader-text">Mộc Tiên Phát</div>
    </div>
  </div>

  <!-- ES5 startup guard: still runs when an older Safari cannot parse app modules. -->
  <script>
    window.__APP_START_GUARD__ = setTimeout(function () {
      var app = document.getElementById('app');
      if (!app || !app.querySelector('.initial-loader')) return;
      var detail = window.__SUPABASE_LOAD_FAILED__
        ? 'Không tải được thư viện dữ liệu. Vui lòng kiểm tra mạng và tải lại trang.'
        : 'Trình duyệt chưa khởi động được ứng dụng. Vui lòng cập nhật Safari/Chrome hoặc tải lại trang.';
      app.innerHTML = '<div class="initial-loader" style="gap:14px;text-align:center;padding:24px">' +
        '<div style="font-size:2rem">⚠️</div>' +
        '<div class="loader-text">Không thể khởi động ứng dụng</div>' +
        '<p style="color:#9ca3af;font-size:14px;max-width:320px">' + detail + '</p>' +
        '<button type="button" class="btn-primary" onclick="window.location.reload()">Thử lại</button></div>';
    }, 18000);
  </script>

  <script nomodule>
    document.getElementById('app').innerHTML = '<div class="initial-loader"><div class="loader-text">Phiên bản trình duyệt này quá cũ. Vui lòng cập nhật iOS hoặc trình duyệt để sử dụng ứng dụng.</div></div>';
  </script>

  <!-- Application Logic -->
  <script type="module" src="js/app.js?v=20260822-remove-task-estimate"></script>
</body>

</html>
